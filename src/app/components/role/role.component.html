<div class="role-crud">
    <h2>Add Role</h2>
    <form [formGroup]="newRoleForm" (ngSubmit)="addRole()">
      <input formControlName="RoleName" placeholder="Role Name" />
      <button type="submit">Add Role</button>
    </form>
  
    <hr />
  
    <div *ngFor="let role of roles" class="role-section">
      <h3>{{ role }}
        <button (click)="deleteRole(role)">Delete Role</button>
      </h3>
  
      <form [formGroup]="userForm" (ngSubmit)="addOrUpdateUser()">
        <input formControlName="CNIC" placeholder="CNIC" />
        <input formControlName="FirstName" placeholder="First Name" />
        <input formControlName="LastName" placeholder="Last Name" />
        <input formControlName="Username" placeholder="Username" />
        <input formControlName="Lat" placeholder="Lat" />
        <input formControlName="long" placeholder="Long" />
        <input formControlName="Role" [value]="role" readonly />
        <button type="submit">{{ editUserMode ? 'Update' : 'Add' }} User</button>
        <button type="button" (click)="cancelEditUser()">Cancel</button>
      </form>
  
      <table border="1" *ngIf="getUsersByRole(role).length > 0">
        <tr>
          <th>CNIC</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Username</th>
          <th>Lat</th>
          <th>Long</th>
          <th>Actions</th>
        </tr>
        <tr *ngFor="let user of getUsersByRole(role)">
          <td>{{ user.CNIC }}</td>
          <td>{{ user.FirstName }}</td>
          <td>{{ user.LastName }}</td>
          <td>{{ user.Username }}</td>
          <td>{{ user.Lat || '-' }}</td>
          <td>{{ user.long || '-' }}</td>
          <td>
            <button (click)="editUser(user)">Edit</button>
            <button (click)="deleteUser(user.CNIC)">Delete</button>
          </td>
        </tr>
      </table>
    </div>
  </div>
