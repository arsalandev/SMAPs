<div class="user-crud">
  <form [formGroup]="userForm" (ngSubmit)="addOrUpdateUser()">
    <input formControlName="CNIC" placeholder="CNIC" />
    <input formControlName="FirstName" placeholder="First Name" />
    <input formControlName="LastName" placeholder="Last Name" />
    <input formControlName="Username" placeholder="Username" />
    <select formControlName="Role">
      <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
    </select>
    <input formControlName="Lat" placeholder="Latitude" />
    <input formControlName="long" placeholder="Longitude" />
    <button type="submit">{{ editMode ? 'Update' : 'Add' }} User</button>
    <button type="button" (click)="cancelEdit()">Cancel</button>
  </form>

  <ng-container *ngIf="users.length !== 0">
    <div *ngFor="let role of roles" class="role-section">
      <h3>{{ role }}s</h3>
      <table border="1">
        <tr>
          <th>CNIC</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Username</th>
          <th>Lat</th>
          <th>Long</th>
          <th>Actions</th>
        </tr>
        <tr *ngFor="let user of getUsersByRole(role)">
          <td>{{ user.CNIC }}</td>
          <td>{{ user.FirstName }}</td>
          <td>{{ user.LastName }}</td>
          <td>{{ user.Username }}</td>
          <td>{{ user.Lat || '-' }}</td>
          <td>{{ user.long || '-' }}</td>
          <td>
            <button (click)="editUser(user)">Edit</button>
            <button (click)="deleteUser(user.CNIC)">Delete</button>
          </td>
        </tr>
      </table>
    </div>
  </ng-container>
  
  
</div>
