<div class="login-container">
    <h2>Login</h2>
    <input type="text" placeholder="Username" [(ngModel)]="username" />
    <input type="text" placeholder="Password" [(ngModel)]="password" *ngIf="step == 2 || step == 3"/>
    <input type="text" placeholder="CODE" [(ngModel)]="Code" *ngIf="step == 3"/>
    <button (click)="loginStep()">Login</button>
  
  </div>
