<!-- SVG Background -->
<svg class="svg-background" viewBox="0 0 1000 1000">
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" class="grid-line"/>
    </pattern>
  </defs>
  
  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Radar Circles -->
  <circle cx="500" cy="500" r="100" class="radar-circle"/>
  <circle cx="500" cy="500" r="200" class="radar-circle" style="animation-delay: 1s"/>
  <circle cx="500" cy="500" r="300" class="radar-circle" style="animation-delay: 2s"/>
  
  <!-- Connecting Lines -->
  <line x1="0" y1="500" x2="1000" y2="500" class="grid-line"/>
  <line x1="500" y1="0" x2="500" y2="1000" class="grid-line"/>
</svg>

<!-- Military Logo -->
<svg class="military-logo" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff99"/>
      <stop offset="100%" stop-color="#007a4d"/>
    </linearGradient>
  </defs>
  
  <!-- Shield Base -->
  <path d="M100,20 L180,50 L180,150 L100,180 L20,150 L20,50 Z" 
        fill="none" 
        stroke="url(#logoGradient)" 
        stroke-width="3"/>
  
  <!-- Eagle -->
  <path d="M100,70 L80,90 L120,90 Z" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Crossed Swords -->
  <line x1="60" y1="60" x2="140" y2="140" stroke="url(#logoGradient)" stroke-width="2"/>
  <line x1="140" y1="60" x2="60" y2="140" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Stars -->
  <circle cx="100" cy="130" r="3" fill="#00ff99"/>
  <circle cx="70" cy="100" r="2" fill="#00ff99"/>
  <circle cx="130" cy="100" r="2" fill="#00ff99"/>
</svg>

<!-- Satellite Animation -->
<div class="satellite">
  <svg width="40" height="40" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="8" fill="none" stroke="#00ff99" stroke-width="1"/>
    <line x1="20" y1="0" x2="20" y2="40" stroke="#00ff99" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#00ff99" stroke-width="1" opacity="0.5"/>
  </svg>
</div>

<!-- Main Login Container -->
<div class="login-container">
  <!-- Step Indicator -->
  <div class="step-indicator">
    <div class="step-dot" [class.active]="step === 1"></div>
    <div class="step-dot" [class.active]="step === 2"></div>
    <div class="step-dot" [class.active]="step === 3"></div>
  </div>
  
  <div class="login-header">
    <h2>ARMY ACCESS PORTAL</h2>
    <p>MULTI-FACTOR AUTHENTICATION SYSTEM</p>
  </div>

  <div class="login-body">
    <!-- Username -->
    <div class="input-group" *ngIf="step >= 1">
      <input 
        type="text" 
        placeholder="OPERATOR ID" 
        [(ngModel)]="username" 
        [attr.disabled]="step > 1 ? true : null"
        />
        
    </div>
    
    <!-- Password -->
    <div class="input-group" *ngIf="step >= 2">
      <input 
        type="password" 
        placeholder="ENCRYPTION KEY" 
        [(ngModel)]="password"
      />

      <!-- [attr.disabled]="step > 2 ? true : null" -->
    </div>
    
    <!-- Verification Code -->
    <div class="input-group" *ngIf="step === 3">
      <input 
        type="text" 
        placeholder="VERIFICATION CODE" 
        [(ngModel)]="Code"
        maxlength="20"
      />
    </div>

    <button (click)="loginStep()">
      {{ getButtonText() }}
    </button>
    <button (click)="reset()" *ngIf="step !== 1">
      Reset
    </button>
    <p *ngIf="message !== ''"  [ngClass]="messageType">
      {{message}}
    </p>
  </div>

  <div class="login-footer">
    <p>CLASSIFIED ACCESS - AUTHORIZED PERSONNEL ONLY</p>
  </div>
</div>

<!-- Status Display -->
<div class="status-display" *ngIf="step > 1">
  <div class="status-line">
    <div class="status-dot"></div>
    <span>USER: {{ UserDetails.Username || 'PENDING' }}</span>
  </div>
  <div class="status-line">
    <div class="status-dot"></div>
    <span>ROLE: {{ UserDetails.Role || 'UNKNOWN' }}</span>
  </div>
  <div class="status-line" *ngIf="step === 3">
    <div class="status-dot"></div>
    <span>ENCRYPTION: ACTIVE</span>
  </div>
</div>
